<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AttendMate · Pure Sync</title>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        /* Changed background to a deep cosmic void instead of flat black */
        body{width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at center, #0B0B1A 0%, #000005 100%);font-family:monospace;cursor:crosshair}
        canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;z-index:0}

        /* Removed fx-grid, kept vignette and subtle scanlines for a cinematic look */
        .fx-scan,.fx-vignette{position:fixed;inset:0;pointer-events:none;z-index:2}
        .fx-scan{background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,0.03)2px,rgba(0,0,0,0.03)3px)}
        .fx-vignette{background:radial-gradient(ellipse 85% 75% at 50% 50%,transparent 30%,rgba(0,0,5,0.9)100%)}

        .planet-label{position:fixed;font-size:10px;color:#64748B;pointer-events:none;transform:translate(-50%,-50%);opacity:0;transition:opacity 0.6s, color 0.3s;display:flex;flex-direction:column;align-items:center;gap:4px;letter-spacing:0.05em;z-index:10;text-shadow:0 2px 4px rgba(0,0,0,0.8)}
        .planet-label .ldot{width:4px;height:4px;border-radius:50%;background:#475569;box-shadow:0 0 6px rgba(71,85,105,0.5)}
        .planet-label.active{color:#00E676;font-size:12px;font-weight:bold;text-shadow:0 0 12px rgba(0,230,118,0.7)}
        .planet-label.active .ldot{background:#00E676;box-shadow:0 0 8px #00E676}
        .planet-label.done{color:#A855F7}
        .planet-label.done .ldot{background:#A855F7;box-shadow:0 0 6px #A855F7}

        #recordCounter{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,230,118,0.15);color:#00E676;padding:6px 18px;border-radius:30px;font-size:13px;font-weight:bold;white-space:nowrap;opacity:0;transition:all 0.4s;box-shadow:0 0 15px rgba(0,230,118,0.4);z-index:20;border: 1px solid rgba(0,230,118,0.3);}
        #recordCounter.show{opacity:1;bottom:100px}
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div class="fx-scan"></div>
<div class="fx-vignette"></div>

<div id="recordCounter">+0 records extracted</div>

<script>
    let scene, camera, renderer, controls;
    let core, coreGlow;
    let stars; // NEW: Starfield variable
    let planets = [];
    let lasers = [];
    let dataParticles = [];
    let recordCount = 0;
    const recordEl = document.getElementById('recordCounter');

    function init() {
        // 1. Scene Setup
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000005, 0.02);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 25);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // --- NEW: 3D Starfield Background ---
        const starGeo = new THREE.BufferGeometry();
        const starCount = 1500;
        const starPos = new Float32Array(starCount * 3);
        for(let i = 0; i < starCount * 3; i++) {
            starPos[i] = (Math.random() - 0.5) * 200; // Spread stars in a huge 200-unit box
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.15,
            transparent: true,
            opacity: 0.8
        });
        stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // --- ADD LIGHTS (Required for realistic Earth) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(10, 5, 10);
        scene.add(sunLight);

        // 2. Central Core (Realistic Earth)
        const coreGeo = new THREE.SphereGeometry(2.8, 64, 64);
        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg');
        const specularTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_specular_2048.jpg');

        const coreMat = new THREE.MeshPhongMaterial({
            map: earthTexture,
            specularMap: specularTexture,
            specular: new THREE.Color('grey'),
            shininess: 15
        });

        core = new THREE.Mesh(coreGeo, coreMat);
        scene.add(core);

        const glowGeo = new THREE.SphereGeometry(3.0, 32, 32);
        const glowMat = new THREE.MeshBasicMaterial({
            color: 0x0088FF,
            transparent: true,
            opacity: 0.15,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending
        });
        coreGlow = new THREE.Mesh(glowGeo, glowMat);
        scene.add(coreGlow);

        if (window.AndroidSync && window.AndroidSync.onEngineReady) {
            window.AndroidSync.onEngineReady();
        }

        window.addEventListener('resize', onWindowResize);
        animate();
    }

    // --- Android Bridge Functions ---

    window.spawnSubject = function(name) {
        const geometry = new THREE.SphereGeometry(0.6, 16, 16);
        const material = new THREE.MeshBasicMaterial({ color: 0x475569, wireframe: true });
        const mesh = new THREE.Mesh(geometry, material);

        const angle = Math.random() * Math.PI * 2;
        const radius = 9 + Math.random() * 8;
        const speed = 0.002 + Math.random() * 0.004;

        mesh.position.set(Math.cos(angle) * radius, (Math.random() - 0.5) * 6, Math.sin(angle) * radius);
        scene.add(mesh);

        const label = document.createElement('div');
        label.className = 'planet-label';
        label.innerHTML = `<div class="ldot"></div><span>${name}</span>`;
        document.body.appendChild(label);

        planets.push({
            name: name,
            mesh: mesh,
            label: label,
            angle: angle,
            radius: radius,
            speed: speed,
            status: 'idle'
        });
    };

    window.startExtraction = function(name) {
        const planet = planets.find(p => p.name === name);
        if (!planet) return;

        planet.status = 'extracting';
        planet.mesh.material.color.setHex(0x00E676);
        planet.label.classList.add('active');

        const material = new THREE.LineBasicMaterial({ color: 0x00E676, transparent: true, opacity: 0.4 });
        const geometry = new THREE.BufferGeometry().setFromPoints([planet.mesh.position, core.position]);
        const line = new THREE.Line(geometry, material);
        scene.add(line);

        planet.laser = line;
    };

    window.updateProgress = function(percent, text) {};

    window.finishSubject = function(name) {
        const planet = planets.find(p => p.name === name);
        if (!planet) return;

        planet.status = 'done';
        planet.mesh.material.color.setHex(0xA855F7);
        planet.label.classList.remove('active');
        planet.label.classList.add('done');

        if (planet.laser) {
            scene.remove(planet.laser);
            planet.laser.geometry.dispose();
            planet.laser.material.dispose();
            planet.laser = null;
        }
    };

    window.recordExtracted = function(count) {
        recordCount += count || 1;
        recordEl.textContent = `+${count} records extracted`;
        recordEl.classList.add('show');
        setTimeout(() => recordEl.classList.remove('show'), 2200);

        for(let i = 0; i < 15; i++) {
            spawnDataParticle();
        }
    };

    function spawnDataParticle() {
        const p = new THREE.Mesh(
            new THREE.SphereGeometry(0.08, 8, 8),
            new THREE.MeshBasicMaterial({color: 0x00E676, transparent:true, opacity:0.9})
        );

        p.position.set(
            (Math.random()-0.5)*30,
            (Math.random()-0.5)*15,
            (Math.random()-0.5)*30
        );
        scene.add(p);

        dataParticles.push({
            mesh: p,
            life: 1.0
        });
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();

        // Slowly rotate the new starfield
        if(stars) {
            stars.rotation.y += 0.0003;
            stars.rotation.x += 0.0001;
        }

        // Earth rotation
        core.rotation.y += 0.005;

        // Earth atmospheric breathing
        const pulse = 1.0 + Math.sin(Date.now() * 0.002) * 0.05;
        coreGlow.scale.setScalar(pulse);

        planets.forEach(p => {
            p.angle += p.speed;
            p.mesh.position.x = Math.cos(p.angle) * p.radius;
            p.mesh.position.z = Math.sin(p.angle) * p.radius;
            p.mesh.rotation.y += 0.02;

            if (p.status === 'extracting' && p.laser) {
                p.laser.geometry.setFromPoints([p.mesh.position, core.position]);
            }

            const vector = p.mesh.position.clone();
            vector.project(camera);

            const x = (vector.x * .5 + .5) * window.innerWidth;
            const y = (vector.y * -.5 + .5) * window.innerHeight;

            if (vector.z > 1) {
                p.label.style.opacity = '0';
            } else {
                p.label.style.opacity = '1';
                p.label.style.left = `${x}px`;
                p.label.style.top = `${y - 30}px`;
            }
        });

        for (let i = dataParticles.length - 1; i >= 0; i--) {
            let p = dataParticles[i];
            p.life -= 0.015;

            p.mesh.position.lerp(new THREE.Vector3(0,0,0), 0.08);
            p.mesh.scale.setScalar(p.life);
            p.mesh.material.opacity = p.life;

            if (p.life <= 0) {
                scene.remove(p.mesh);
                p.mesh.geometry.dispose();
                p.mesh.material.dispose();
                dataParticles.splice(i, 1);
            }
        }

        renderer.render(scene, camera);
    }

    init();
</script>
</body>
</html>
